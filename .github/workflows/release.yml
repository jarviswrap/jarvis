name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # 可选：支持手动触发
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Pub get
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create DMG (macOS)
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="build/macos/Build/Products/Release"
          echo "Listing $APP_DIR"; ls -la "$APP_DIR" || true
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under $APP_DIR" >&2
            exit 1
          fi
          STAGING="$APP_DIR/dmg_src"
          DMG_PATH="$APP_DIR/jarvis-macos.dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/$(basename "$APP_PATH")"
          hdiutil create -volname "Jarvis" -srcfolder "$STAGING" -ov -format UDZO "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
      - name: Upload artifact (macOS DMG)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: ${{ env.DMG_PATH }}

  release:
    runs-on: ubuntu-latest
    needs: [build-macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-macos
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jarvis-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}