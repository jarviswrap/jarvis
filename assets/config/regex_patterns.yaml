# 正则表达式配置文件
regex_patterns:
  # 编程相关
  programming:
    - id: "android_native_stack"
      name: "Android Native堆栈"
      pattern: ".*#\\d+\\s+pc\\s+([0-9a-fA-F]{6,16})\\s+([^\\[\\s]+).*"
      description: "提取Android Native堆栈中的地址和库文件"
      example: "地址: 0032e8cf, 库文件: /data/data/sg.bigo.live/files/lib-uncompressed/arm/libmediasdk.so"
      category: "编程相关"