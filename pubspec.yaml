name: jarvis
description: 智能工作助手（跨平台桌面：macOS / Linux / Windows）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  code_text_field: ^1.1.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  google_fonts: ^6.1.0
  highlight: ^0.7.0
  multi_split_view: ^3.6.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scripts.json
