name: jarvis
description: A comprehensive intelligent assistant app for streamlining daily work and life scenarios with quick-build productivity tools
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  shared_preferences: ^2.2.2

  # UI Components 
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3

  # File System
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  path: ^1.8.3

  # Process Management，执行系统命令，例如git相关操作
  # 参考：https://pub.dev/packages/process_run
  process_run: ^0.12.5+2
  
  # 新增依赖
  yaml: ^3.1.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

